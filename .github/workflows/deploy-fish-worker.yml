name: Deploy Fish API Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        run: npm install

      - name: Validate required secrets
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$FISH_API_KEY" || (echo "Missing FISH_API_KEY" && exit 1)

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Store Fish API key as Worker secret
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: printf '%s' "$FISH_API_KEY" | npx wrangler secret put FISH_API_KEY

      - name: Deployment note
        run: echo "Copy the workers.dev URL printed above into fish-config.js as window.KPNC_FISH_API_BASE."
