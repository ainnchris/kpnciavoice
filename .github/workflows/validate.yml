name: Validate KPNC Voice Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check custom-voices.js
          node --check fish-config.js
          node --check tts-worker.js
          node --check worker/src/index.js

      - name: Check JSON manifests
        run: python -m json.tool worker/package.json > /dev/null

      - name: Verify required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f custom-voices.css
          test -f custom-voices.js
          test -f fish-config.js
          test -f worker/src/index.js
          test -f worker/wrangler.toml
          test -f worker/package.json
          test -f .github/workflows/deploy-fish-worker.yml
